<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif">
  <title>Migration pipeline: 3,856 rows of SharePoint part data cleaned in Jupyter and Pandas, labeled with Naive Bayes, rebuilt into BOMs, and imported into Arena PLM as 1,577 unique items</title>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d9dad6" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#111315"/>
    </marker>
  </defs>
  <rect width="1200" height="900" fill="#ecedea"/>
  <rect width="1200" height="900" fill="url(#grid)"/>

  <!-- Source -->
  <g>
    <rect x="45" y="120" width="330" height="250" fill="#fff" stroke="#111315" stroke-width="2"/>
    <text x="69" y="160" font-size="15" fill="#5d6167" letter-spacing="1.5">SOURCE</text>
    <text x="69" y="198" font-size="26" font-weight="800" fill="#111315">SharePoint</text>
    <text x="69" y="240" font-size="18" fill="#3b3f44">3,856 rows of part data,</text>
    <text x="69" y="265" font-size="18" fill="#3b3f44">hundreds of BOM sheets</text>
    <g fill="none" stroke="#5d6167" stroke-width="1.5">
      <rect x="69" y="296" width="70" height="46"/><path d="M69 311h70M69 326h70M92 296v46M115 296v46"/>
      <rect x="155" y="296" width="70" height="46"/><path d="M155 311h70M155 326h70M178 296v46M201 296v46"/>
      <rect x="241" y="296" width="70" height="46"/><path d="M241 311h70M241 326h70M264 296v46M287 296v46"/>
    </g>
  </g>

  <!-- Clean -->
  <g>
    <rect x="435" y="120" width="330" height="250" fill="#fff" stroke="#111315" stroke-width="2"/>
    <text x="459" y="160" font-size="15" fill="#5d6167" letter-spacing="1.5">STEP 1 · CLEAN</text>
    <text x="459" y="198" font-size="26" font-weight="800" fill="#111315">Jupyter + Pandas</text>
    <text x="459" y="240" font-size="18" fill="#3b3f44">Unify names, look up parts,</text>
    <text x="459" y="265" font-size="18" fill="#3b3f44">merge duplicate rows</text>
    <text x="459" y="320" font-size="16" fill="#5d6167" font-family="ui-monospace, Menlo, Consolas, monospace">df.drop_duplicates()</text>
    <text x="459" y="345" font-size="16" fill="#5d6167" font-family="ui-monospace, Menlo, Consolas, monospace">.str.strip().str.upper()</text>
  </g>

  <!-- Infer -->
  <g>
    <rect x="825" y="120" width="330" height="250" fill="#fff" stroke="#111315" stroke-width="2"/>
    <text x="849" y="160" font-size="15" fill="#5d6167" letter-spacing="1.5">STEP 2 · LABEL</text>
    <text x="849" y="198" font-size="26" font-weight="800" fill="#111315">Naive Bayes</text>
    <text x="849" y="240" font-size="18" fill="#3b3f44">Label each part from the</text>
    <text x="849" y="265" font-size="18" fill="#3b3f44">words that describe it</text>
    <text x="849" y="320" font-size="16" fill="#5d6167" font-family="ui-monospace, Menlo, Consolas, monospace">"SCREW SHCS M4X10"</text>
    <text x="849" y="345" font-size="16" fill="#111315" font-family="ui-monospace, Menlo, Consolas, monospace">→ MECHANICAL</text>
  </g>

  <path d="M375 245H427" stroke="#111315" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M765 245H817" stroke="#111315" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Down to review -->
  <path d="M990 370V440H600V492" fill="none" stroke="#111315" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="425" y="500" width="350" height="70" fill="#fff" stroke="#111315" stroke-width="2" />
  <text x="600" y="542" font-size="19" font-weight="700" fill="#111315" text-anchor="middle">Rebuild BOMs on clean items</text>
  <path d="M600 570V622" stroke="#111315" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Arena -->
  <g>
    <rect x="45" y="630" width="1110" height="190" fill="#111315"/>
    <text x="75" y="672" font-size="15" fill="#c9cbc6" letter-spacing="1.5">1,577 UNIQUE ITEMS · ONE SOURCE OF TRUTH</text>
    <text x="75" y="714" font-size="36" font-weight="800" fill="#fff">Arena PLM</text>
    <g font-size="18" fill="#fff">
      <rect x="75" y="740" width="250" height="54" fill="none" stroke="#fff" stroke-width="1.5"/>
      <text x="200" y="773" text-anchor="middle">Items + part numbers</text>
      <rect x="345" y="740" width="170" height="54" fill="none" stroke="#fff" stroke-width="1.5"/>
      <text x="430" y="773" text-anchor="middle">BOMs</text>
      <rect x="535" y="740" width="170" height="54" fill="none" stroke="#fff" stroke-width="1.5"/>
      <text x="620" y="773" text-anchor="middle">ECOs</text>
      <rect x="725" y="740" width="170" height="54" fill="none" stroke="#fff" stroke-width="1.5"/>
      <text x="810" y="773" text-anchor="middle">Sourcing</text>
      <rect x="915" y="740" width="210" height="54" fill="none" stroke="#fff" stroke-width="1.5"/>
      <text x="1020" y="773" text-anchor="middle">CAD files</text>
    </g>
  </g>
</svg>
